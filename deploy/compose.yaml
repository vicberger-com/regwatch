# Development stack. Service, network and volume names are contract names
# (docs/contracts/M0-tooling.md). Run from the repository root with `make dev`.
# Images are pinned by tag and digest (docs/08-security-compliance.md 8.6 item 4).
name: regwatch

x-app: &app
  build:
    context: ../api
    target: dev
  image: regwatch-api:dev
  env_file:
    - .env
    # The index sidecar's URL, user, password and CA (scripts/index-setup.sh; ADR-0011). Optional:
    # without it search runs on PostgreSQL alone.
    - path: index.env
      required: false
  networks: [regwatch]
  restart: unless-stopped

services:
  proxy:
    image: caddy:2@sha256:36c24ad91a7ff7bc4c87fe22bfa8df3c4b18da0773d73fc12ee2c52b98c0bb7e
    # Published on loopback only: the development stack is not reachable from other machines.
    # From elsewhere, use an SSH tunnel (ssh -L 8080:127.0.0.1:80 host), never a wider bind.
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    networks:
      # A fixed address, so REGWATCH_TRUSTED_PROXIES can name exactly the proxy (BL-73).
      regwatch: { ipv4_address: 10.89.0.2 }
      edge: {}
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    <<: *app
    command: ["regwatch-api", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ../api/src:/app/src:ro
      - objectstore:/data/objectstore
    depends_on:
      db: { condition: service_healthy }
      queue: { condition: service_healthy }
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/version', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Celery (M3, ADR-0006): the worker serves the capture queue; exactly one beat runs.
  worker:
    <<: *app
    command: ["regwatch-worker"]
    volumes:
      - objectstore:/data/objectstore
    depends_on:
      api: { condition: service_healthy }

  beat:
    <<: *app
    command: ["regwatch-beat"]
    depends_on:
      api: { condition: service_healthy }

  # Vite dev server with hot reload; proxy sends every non-/api path here.
  web:
    build:
      context: ../web
    image: regwatch-web:dev
    volumes:
      - ../web/src:/app/src:ro
      - ../web/index.html:/app/index.html:ro
    environment:
      # Optional HTTPS proxy host for the dev server (deploy/README.md); empty means localhost.
      REGWATCH_DEV_PUBLIC_HOST: ${REGWATCH_DEV_PUBLIC_HOST:-}
    networks: [regwatch]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # One-off migrations as the owner (make migrate). The only app container given db.env, so
  # long-running api, worker and beat containers never hold owner credentials (BL-61).
  migrate:
    <<: *app
    profiles: [tools]
    env_file: [.env, db.env]
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db: { condition: service_healthy }

  db:
    image: postgres:16@sha256:5db6dac2ef5dcff512f4f00a009c3c332b9f2f28f24277175bf3e4a3d02ef83a
    environment:
      POSTGRES_USER: regwatch
      POSTGRES_DB: regwatch
    # POSTGRES_PASSWORD (owner) and POSTGRES_APP_PASSWORD (regwatch_api, made by db-init).
    env_file: db.env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    networks: [regwatch]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "regwatch", "-d", "regwatch"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Valkey with a password (BL-90 (a)): the default user is off and only `regwatch`, whose
  # password is in deploy/queue.env, may connect. The ACL is written to a file inside the
  # container at start, so the password is never on a command line or in the image. No port is
  # published.
  queue:
    image: valkey/valkey:9@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
    networks: [regwatch]
    env_file: queue.env
    command:
      - sh
      - -c
      - >-
        : "$${VALKEY_PASSWORD:?set in deploy/queue.env; run scripts/dev-env.sh}";
        umask 077;
        printf 'user default off\nuser regwatch on >%s ~* &* +@all\n' "$$VALKEY_PASSWORD"
        > /tmp/users.acl;
        exec valkey-server --aclfile /tmp/users.acl
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$VALKEY_PASSWORD\" valkey-cli --user regwatch ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Internal-only sidecar (ADR-0001 decision 3).
  pdf:
    image: gotenberg/gotenberg:8@sha256:13672f317b443c793e972b1bd2155ec62a3e7b6891b411e8196442cc053ee5f5
    networks: [regwatch]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Development only: catches all outgoing mail; UI on http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    ports:
      - "127.0.0.1:8025:8025"
    networks: [regwatch, edge]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Optional egress sidecars. They need internet access, which the internal `regwatch`
  # network does not give. CP-18 (ADR-0010 decision 6, BL-48): `search` alone joins the
  # `egress` network; nothing else does, and no port is published. Translate (M4) stays on the
  # internal network until its own decision.
  search:
    # Tag 2026.11.17-b99cf7496, read from Docker Hub on 2026-11-18 (ADR-0010).
    image: searxng/searxng@sha256:0b9f3ddd85efc8df189e6543d65702abfa8f3ed1c32229a53f7707cd12b554ef
    profiles: [search]
    networks: [regwatch, egress]
    # SEARXNG_SECRET, generated by scripts/dev-env.sh; never committed. Optional so the stack
    # loads without it; SearXNG refuses to start on its default key, so it fails closed.
    env_file:
      - path: search.env
        required: false
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  translate:
    image: libretranslate/libretranslate:v1.9.6
    profiles: [translate]
    networks: [regwatch]
    healthcheck:
      test: ["CMD-SHELL", "./venv/bin/python scripts/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s

  # OpenSearch for M5 search and map aggregations (ADR-0011, CP-22). Prepared by
  # scripts/index-setup.sh; profile `index`. Internal network only and no published port: the
  # API and worker reach it at https://index:9200 with TLS (the stack's own CA) and the
  # least-privilege `regwatch` user; the security plugin is never disabled.
  # Tag 3.9.0, read from Docker Hub on 2026-11-19.
  index:
    image: opensearchproject/opensearch@sha256:3bf4fe26aeb9f7b03c0ebcb1302bb24e855ee6b89fd926d26a71a83ef6f7e076
    profiles: [index]
    networks: [regwatch]
    environment:
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
    volumes:
      - ./opensearch/opensearch.yml:/usr/share/opensearch/config/opensearch.yml:ro
      - ./opensearch/generated/certs:/usr/share/opensearch/config/certs:ro
      - ./opensearch/generated/security:/usr/share/opensearch/config/opensearch-security:ro
      - index-data:/usr/share/opensearch/data
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    mem_limit: 2g
    healthcheck:
      # Any HTTP answer over TLS means the node is up; 401 is expected without credentials.
      test: ["CMD-SHELL", "curl -s -o /dev/null --cacert config/certs/ca.pem https://index:9200/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  # print-bridge (profile `print`) is deferred: ADR-0001 decision 6, BL-13, BL-15.
  # Nothing is built for it until a CP issue settles the print path.

networks:
  regwatch:
    internal: true
    # Pinned so the proxy address above is stable. Docker assigns other containers addresses
    # from ip_range only, so none can take 10.89.0.2 first (re-review 5a). The contract default
    # REGWATCH_TRUSTED_PROXIES is exactly 10.89.0.2/32; change the subnet, the range, the proxy
    # address and that variable together if the subnet collides with a host network.
    ipam:
      config:
        - subnet: 10.89.0.0/24
          ip_range: 10.89.0.128/25
  edge: {}
  # CP-18: internet access for the `search` sidecar only (ADR-0010 decision 6).
  egress: {}

volumes:
  pgdata:
  objectstore:
  caddy-data:
  index-data:
