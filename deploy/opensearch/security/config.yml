# The security plugin's authentication: HTTP basic against the internal user database, nothing
# anonymous (ADR-0011, CP-22).
_meta: { type: config, config_version: 2 }
config:
  dynamic:
    http:
      anonymous_auth_enabled: false
    authc:
      basic_internal_auth_domain:
        http_enabled: true
        transport_enabled: true
        order: 0
        http_authenticator: { type: basic, challenge: true }
        authentication_backend: { type: intern }
