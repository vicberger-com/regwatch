# Least privilege, on the regwatch indexes only (ADR-0011; review of the OpenSearch slices,
# finding 2). The API only reads; the worker writes. Neither may delete an index, run a script
# (update_by_query, delete_by_query) or read the security configuration.
_meta: { type: roles, config_version: 2 }
regwatch_search:
  cluster_permissions:
    - cluster:monitor/health
  index_permissions:
    - index_patterns: ["regwatch-*"]
      allowed_actions:
        - indices:data/read/search*
regwatch_indexer:
  cluster_permissions:
    - cluster:monitor/health
    - indices:data/write/bulk
  index_permissions:
    - index_patterns: ["regwatch-*"]
      allowed_actions:
        - indices:admin/create
        - indices:admin/aliases
        - indices:admin/refresh*
        # refresh_interval during a rebuild (index.bulk_mode); any dynamic setting, worker only
        - indices:admin/settings/update
        - indices:data/write/bulk*
        - indices:data/write/index
        - indices:data/write/delete
