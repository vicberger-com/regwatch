# System facets and their terms: docs/04-data-model.md 4.5, with the Gate G0 additions
# (docs/decisions/G0-decisions.md: supply chain security among the topics; BL-21 match rules).
# Hand-written. Term keys of regulation_type equal regulation.instrument_type values.
# Match rules follow the M2 schema {keywords, regex, languages, min_hits, weight}; the SSDF and
# AI RMF identifiers come from NIST OSCAL content (CC0-1.0, commit f0de6d8, R-03 C5).
facets:
  - key: topic
    label: Topic
    system: true
    show_in_view_selector: true
    sort_order: 10
    terms:
      - { key: cybersecurity, label: Cybersecurity }
      - { key: data-protection, label: Data protection }
      - { key: privacy, label: Privacy }
      - { key: critical-infrastructure, label: Critical infrastructure }
      - { key: incident-reporting, label: Incident reporting }
      - key: ai-governance
        label: AI governance
        match_rules: { keywords: [AI RMF, AI 100-1], regex: [], languages: [], min_hits: 1, weight: 1.0 }
      - { key: digital-identity, label: Digital identity }
      - { key: telecoms-security, label: Telecoms security }
      - { key: product-security, label: Product security }
      - { key: cloud-outsourcing, label: Cloud and outsourcing }
      - { key: cross-border-transfer, label: Cross-border transfer }
      - key: supply-chain-security
        label: Supply chain security
        match_rules:
          { keywords: [SSDF, SP 800-218, software bill of materials, SBOM], regex: [], languages: [], min_hits: 1, weight: 1.0 }
      - { key: encryption, label: Encryption }
      - { key: consumer-protection, label: Consumer protection }
  - key: industry
    label: Industry
    system: true
    show_in_view_selector: true
    sort_order: 20
    terms:
      - { key: finance, label: Finance }
      - { key: health, label: Health }
      - { key: energy, label: Energy }
      - { key: telecoms, label: Telecoms }
      - { key: public-sector, label: Public sector }
      - { key: defence, label: Defence }
      - { key: transport, label: Transport }
      - { key: retail, label: Retail }
      - { key: technology, label: Technology }
      - { key: all, label: All industries }
  - key: technology
    label: Technology
    system: true
    show_in_view_selector: true
    sort_order: 30
    terms:
      - { key: cloud, label: Cloud }
      - { key: ai-machine-learning, label: AI and machine learning }
      - { key: iot, label: IoT }
      - { key: cryptography, label: Cryptography }
      - { key: identity, label: Identity }
      - { key: networks, label: Networks }
      - { key: software-supply-chain, label: Software supply chain }
      - { key: mobile, label: Mobile }
      - { key: operational-technology, label: Operational technology }
  - key: regulation_type
    label: Regulation type
    system: true
    show_in_view_selector: true
    sort_order: 40
    terms:
      - { key: act, label: Act }
      - { key: regulation, label: Regulation }
      - { key: directive, label: Directive }
      - { key: bill, label: Bill }
      - { key: guidance, label: Guidance }
      - { key: standard, label: Standard }
      - { key: decision, label: Decision }
      - { key: enforcement_action, label: Enforcement action }
      - { key: consultation, label: Consultation }
