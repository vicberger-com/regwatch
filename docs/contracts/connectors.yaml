# JSON Schema (draft 2020-12, expressed in YAML) for source.config and capture_job.extraction_rules per connector kind.
# The API validates on write; the admin UI renders forms from these schemas; connectors read them as Pydantic models.

common_extraction_rules: &rules
  type: object
  additionalProperties: false
  properties:
    content_selectors: { type: array, items: { type: string }, description: CSS selectors whose text forms the content; empty means trafilatura main-text extraction }
    exclude_selectors: { type: array, items: { type: string }, description: removed before hashing and extraction (dates, counters, navigation) }
    title_selector: { type: string }
    date_selector: { type: string }
    date_format: { type: string, description: strptime format; omitted means dateparser }
    include_url_patterns: { type: array, items: { type: string, format: regex } }
    exclude_url_patterns: { type: array, items: { type: string, format: regex } }
    strip_query_params: { type: boolean, default: true }
    min_text_length: { type: integer, default: 200 }

rss:
  config:
    type: object
    additionalProperties: false
    required: [feed_url]
    properties:
      feed_url: { type: string, format: uri }
      fetch_full_page: { type: boolean, default: true, description: follow each entry link and extract the page; false stores the feed summary only }
      max_entries: { type: integer, default: 100, maximum: 1000 }
      etag_conditional: { type: boolean, default: true }
  extraction_rules: *rules

web_page:
  config:
    type: object
    additionalProperties: false
    required: [page_url]
    properties:
      page_url: { type: string, format: uri }
      mode: { type: string, enum: [single, listing], default: single, description: single = one document that changes; listing = a page linking to documents }
      listing_link_selector: { type: string, description: required when mode=listing }
      max_links: { type: integer, default: 50, maximum: 500 }
      wait_for_selector: { type: string, description: used when render_js is on }
  extraction_rules: *rules

web_crawl:
  config:
    type: object
    additionalProperties: false
    required: [seed_urls, allowed_domains]
    properties:
      seed_urls: { type: array, minItems: 1, maxItems: 20, items: { type: string, format: uri } }
      allowed_domains: { type: array, minItems: 1, items: { type: string } }
      max_depth: { type: integer, default: 3, maximum: 5 }
      max_pages_per_run: { type: integer, default: 200, maximum: 2000 }
      politeness_delay_seconds: { type: number, default: 2, minimum: 0.5 }
      follow_sitemaps: { type: boolean, default: false }
  extraction_rules: *rules

search_query:
  config:
    type: object
    additionalProperties: false
    required: [query]
    properties:
      query: { type: string, maxLength: 500 }
      site_filters: { type: array, items: { type: string }, description: restrict to these domains }
      languages: { type: array, items: { type: string } }
      time_range: { type: string, enum: [day, week, month, year, any], default: month }
      max_results: { type: integer, default: 50, maximum: 200 }
      official_domains_only: { type: boolean, default: false }
  extraction_rules: *rules

api_feed:
  config:
    type: object
    additionalProperties: false
    required: [provider]
    properties:
      provider: { type: string, enum: [federal_register, eur_lex, legislation_gov_uk, generic_json] }
      params: { type: object, description: provider-specific query parameters, validated by the adapter }
      endpoint_url: { type: string, format: uri, description: generic_json only }
      item_path: { type: string, description: generic_json only; JSONPath to the array of entries }
      field_map: { type: object, description: generic_json only; maps url, title, published_at, summary, external_id to JSONPaths }
      api_key_secret_name: { type: string, description: name of an environment variable holding the key; never the key itself }
  extraction_rules: *rules

manual:
  config:
    type: object
    additionalProperties: false
    properties:
      note: { type: string }
  extraction_rules: *rules

# Candidate and RawDocument, the connector protocol's two records (Python dataclasses mirror these)
candidate:
  type: object
  required: [url]
  properties:
    url: { type: string, format: uri }
    title: { type: string }
    published_at: { type: string, format: date-time }
    external_id: { type: string }
    summary: { type: string }
    language: { type: string }
    hints: { type: object }
raw_document:
  type: object
  required: [url, fetched_at, status, body_ref, mime]
  properties:
    url: { type: string, format: uri }
    final_url: { type: string, format: uri }
    fetched_at: { type: string, format: date-time }
    status: { type: integer }
    headers: { type: object }
    body_ref: { type: string, description: object store key of the raw body }
    mime: { type: string }
    text: { type: string, description: pre-extracted text when the connector already has it (feeds, APIs) }
    metadata: { type: object }
