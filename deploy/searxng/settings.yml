# SearXNG settings for regwatch (ADR-0010). Mounted read-only into the `search` container,
# which runs the official image unmodified (ADR-0003 decision 2). The secret key is not here:
# it comes from deploy/search.env (SEARXNG_SECRET), generated by scripts/dev-env.sh.
use_default_settings:
  engines:
    # R-07 section 4: DuckDuckGo, and Brave, Google and Qwant where they answer from the
    # production address; Bing and Wikipedia stay off.
    keep_only: [duckduckgo, brave, google, qwant]
general:
  instance_name: regwatch-search
  enable_metrics: false
server:
  # Reached only by regwatch's own workers on the internal network; never published.
  public_instance: false
  limiter: false
  image_proxy: false
  method: GET
search:
  safe_search: 0
  # The JSON format is what the connector reads; HTML stays for the container's health check.
  formats: [html, json]
outgoing:
  request_timeout: 6.0
  max_request_timeout: 10.0
