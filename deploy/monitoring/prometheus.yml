# Prometheus for the optional `monitoring` profile (M10.5; REQ-01; acceptance 4). It scrapes the
# API's metrics listener on the internal network (M10.1b) and evaluates alerts.yml.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: regwatch-api
    static_configs:
      - targets: ["api:9464"]
