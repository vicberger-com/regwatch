# Curated cues M4 tags jurisdictions by, beside the country names in gazetteer.json (M4 design
# notes: gazetteer match on country names and demonyms; acceptance 2). Project data, written by
# hand. Full names only: acronyms (BSI, NCSC, CNIL alone) name several bodies across countries.
# authorities: an agency or legislature of that jurisdiction (confidence 0.9).
# demonyms: adjectives of the jurisdiction in the rule languages (confidence 0.75).
