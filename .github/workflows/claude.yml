# Claude Code GitHub Action, interactive mode.
# Trigger: mention @claude in an issue or pull request comment, in a PR review, or in a new issue body or title;
# or add the "claude" label to an issue. Claude replies in a tracking comment, works on a claude/* branch and opens a PR.
# Authentication: the repository secret ANTHROPIC_API_KEY, an API key created in the Claude Console (platform.claude.com).
# Runs are billed per token to that Console account's credits, never to a claude.ai subscription. (The subscription route,
# claude_code_oauth_token with a token from `claude setup-token`, is deliberately not used here.)
# Docs: https://code.claude.com/docs/en/github-actions
name: Claude Code

# DISABLED 2026-11-01 by owner decision: work runs as Claude Code cloud sessions instead (billed to the claude.ai
# cloud session credit), and the Console account behind ANTHROPIC_API_KEY has no balance. Manual runs only.
# To re-enable, restore these triggers:
#   issue_comment: {types: [created]}
#   pull_request_review_comment: {types: [created]}
#   pull_request_review: {types: [submitted]}
#   issues: {types: [opened, labeled]}
on:
  workflow_dispatch:

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude') || github.event.label.name == 'claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          label_trigger: "claude"
          track_progress: true
          branch_prefix: "claude/"
          base_branch: "main"
          # Tools beyond the defaults. Network access is limited to GitHub, package indexes and project pages
          # so research tasks can open LICENSE files; build tools are allowed for Phase 1 onwards.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 80
            --allowedTools "WebFetch,WebSearch,Bash(gh api:*),Bash(gh issue:*),Bash(gh pr:*),Bash(git ls-remote:*),Bash(curl -sL https://raw.githubusercontent.com/*),Bash(curl -sL https://api.github.com/*),Bash(curl -sL https://pypi.org/*),Bash(curl -sL https://registry.npmjs.org/*),Bash(make:*),Bash(uv:*),Bash(pnpm:*),Bash(pytest:*),Bash(ruff:*),Bash(mypy:*),Bash(python3:*),Bash(node:*),Bash(docker compose:*)"
