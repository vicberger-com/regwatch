# Claude Code GitHub Action, interactive mode.
# Trigger: mention @claude in an issue or pull request comment, in a PR review, or in a new issue body or title;
# or add the "claude" label to an issue. Claude replies in a tracking comment, works on a claude/* branch and opens a PR.
# Authentication: add the repository secret ANTHROPIC_API_KEY, an API key from the Claude Console (platform.claude.com);
# runs are billed per token to that Console account, not to a Claude subscription. To bill a subscription instead,
# replace the anthropic_api_key line with   claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}   (from `claude setup-token`).
# Docs: https://code.claude.com/docs/en/github-actions
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, labeled]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude') || github.event.label.name == 'claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          label_trigger: "claude"
          track_progress: true
          branch_prefix: "claude/"
          base_branch: "main"
          claude_args: |
            --model claude-opus-5-5
            --max-turns 80
