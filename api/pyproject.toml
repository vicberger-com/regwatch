[project]
name = "regwatch"
version = "0.1.0"
description = "Regulatory monitor: API, workers and scheduler"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.7",
    "structlog>=24.4",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "alembic>=1.13",
    "asyncpg>=0.30",
    "pyyaml>=6.0",
    "argon2-cffi>=23.1",
    "google-re2>=1.1,<2",
    "httpx>=0.27,<1",  # SafeFetcher (M3), register 3.6
    "protego>=0.7,<1",  # robots.txt (M3), register 3.6, R-01 C1
    "tenacity>=9.2,<10",  # bounded retries (M3), register 3.6, R-01 C2
    "redis>=8.1,<9",  # Valkey client (M3), register 3.6, R-01 C3
    "markdown-it-py>=4.3,<5",  # BL-68, register 3.6
    "defusedxml>=0.7.1,<0.8",  # BL-68, register 3.6: SVG logo parsing
    "nh3>=0.3.7,<0.4",  # BL-68, register 3.6; bundled crates in R-01 B1 to B3
    "python-multipart>=0.0.33,<0.1",  # BL-68, register 3.6: logo upload form parsing
    "celery>=5.7,<6",  # scheduler and workers (M3, ADR-0006), register 3.6, R-01 C4 to C16
    "feedparser>=6.0.14,<7",  # RSS and Atom (M3), register 3.6, R-01 C17 and C18
    "html5lib>=1.1,<2",  # web page parsing (M3, ADR-0009, CP-15), register 3.6, R-01 C19
    # html5lib's one new dependency; 0.6.1 on PyPI has no tag in its repository (R-01 C20)
    "webencodings>=0.5.1,<0.6",
    "lingua-language-detector==2.2.0",
    "rapidfuzz==3.14.6",
]

[project.scripts]
regwatch-api = "regwatch.api.main:main"
regwatch-worker = "regwatch.core.entrypoints:worker"
regwatch-beat = "regwatch.core.entrypoints:beat"
regwatch-seed = "regwatch.core.entrypoints:seed"
regwatch-admin = "regwatch.core.entrypoints:admin"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "schemathesis>=4.33.0",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20261030",
    "hypothesis>=6.100",
]

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S608"]  # S608: fixtures build SQL from parsed ids

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["regwatch"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

# Strict for core, identity and capture (docs/contracts/M0-tooling.md); gradual elsewhere until Phase 5.
[[tool.mypy.overrides]]
module = ["regwatch.core.*", "regwatch.identity.*", "regwatch.capture.*"]
strict = true

# google-re2 ships no type information (M2, BL-74).
[[tool.mypy.overrides]]
module = ["re2"]
ignore_missing_imports = true

# defusedxml ships no type information (BL-68); its stubs would be one more dependency.
[[tool.mypy.overrides]]
module = ["defusedxml", "defusedxml.*"]
ignore_missing_imports = true

# Celery ships no type information (M3, ADR-0006); stubs would be one more dependency. Only the
# task module uses its untyped decorator, so only it waives that check.
[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

# feedparser ships no type information (M3); the connector treats what it returns as Any.
[[tool.mypy.overrides]]
module = ["feedparser", "feedparser.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["regwatch.capture.tasks"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = '-ra --strict-markers -m "not integration and not security and not perf"'
markers = [
    "integration: needs Docker services (a throwaway PostgreSQL); counted in the coverage floor",
    "stack: needs the running Compose stack (make test-integration); also marked integration",
    "security: security regression tests; selected by the CI security job",
    "perf: performance tests; selected by the CI perf job",
]

[tool.coverage.run]
# SQLAlchemy's asyncio layer runs on greenlets; without this, lines after a database call
# are not recorded.
concurrency = ["thread", "greenlet"]
source = ["regwatch"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
