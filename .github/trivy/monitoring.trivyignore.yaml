# Accepted high findings in the monitoring images (M10.5 review): Grafana 13.3.1 and Prometheus
# 3.16.0, separate tooling services of the optional `monitoring` profile, never bundled. CI
# fails on HIGH and CRITICAL findings with a fix; these are fixed upstream but in no release
# yet, or sit in Grafana data-source plugins disabled by GF_PLUGINS_DISABLE_PLUGINS (only
# Prometheus is enabled). Each expires within 30 days (BL-146).
vulnerabilities:
  - id: CVE-2026-111943
    paths:
      - usr/share/grafana/data/plugins-bundled/mysql/gpx_grafana-mysql-datasource_linux_amd64
