name: Set up web toolchain
description: Node 22 and pnpm (corepack, version from web/package.json) with the pnpm store cached (#29)
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "22"
    - name: Enable pnpm through corepack
      id: pnpm
      shell: bash
      run: |
        corepack enable
        cd web && corepack install
        echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm.outputs.store }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-
    - name: Install web dependencies
      shell: bash
      run: cd web && pnpm install --frozen-lockfile
