<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Announcements - Office of Fixture Regulation</title></head>
<body>
<!-- regwatch test fixture (issue #12): the announcements exist only after the script runs.
     It fetches /pages/js_rendered_data.json from the same origin and builds the list.
     A static fetch sees only "Loading announcements"; a render_js capture (Playwright) sees
     three announcements, the first titled "Rendered announcement: cloud outsourcing guidance". -->
<main>
  <h1>Announcements</h1>
  <div id="announcements" aria-live="polite"><p>Loading announcements</p></div>
</main>
<script>
document.addEventListener("DOMContentLoaded", function () {
  fetch("/pages/js_rendered_data.json")
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var list = document.createElement("ul");
      data.items.forEach(function (item) {
        var li = document.createElement("li");
        var a = document.createElement("a");
        a.href = item.href;
        a.textContent = item.title;
        li.appendChild(a);
        list.appendChild(li);
      });
      var target = document.getElementById("announcements");
      target.replaceChildren(list);
      target.setAttribute("data-rendered", "true");
    });
});
</script>
</body>
</html>
