# Reviewed license exceptions for scripts/license-scan.sh (REQ-20, docs/03-architecture.md 3.5).
#
# Add an entry only after reading the package's own LICENSE file in its repository at the tag
# (or untagged HEAD, with the date) that matches the version. Fields:
#   ecosystem  python | node
#   package    name as the inventory reports it; version: exact version, or "*"
#   license    the license the LICENSE file actually grants (SPDX)
#   scope      any      -> metadata correction; the corrected license must be on the allow-list
#              tooling  -> development tooling only; the scan fails if the package becomes a
#                          runtime (bundled) dependency
#   reason, reviewed (where and when the LICENSE file was read), adr (required for a
#   prohibited or review-required license, which also needs owner approval; 3.5, ADR-0003)
# An exception whose package is no longer installed prints a warning: remove it.

# --- Metadata corrections -------------------------------------------------------------------

[[exception]]
ecosystem = "python"
package = "httpx"
version = "0.28.1"
license = "BSD-3-Clause"
scope = "any"
reason = "Wheel metadata says only the classifier 'BSD License'; LICENSE.md is the 3-clause text"
reviewed = "encode/httpx tag 0.28.1 (26d48e0) LICENSE.md, read 2026-11-02 (#29); register row V"

